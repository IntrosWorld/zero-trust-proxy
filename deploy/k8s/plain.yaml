# Source: zt-proxy/templates/proxy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zt-proxy
spec:
  replicas: 3
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: zt-proxy}
  template:
    metadata:
      labels: {app: zt-proxy}
      annotations:
        checksum/config: bce92b8b69077c404b54dad4af58eb53c14ac896a7ae367531b8fa2d3c192f3c
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: zt-proxy}
      containers:
        - name: proxy
          image: "zt-proxy:kubernetes"
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/zt-proxy/config.json]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - {name: proxy, containerPort: 3128}
            - {name: admin, containerPort: 9100}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {"limits":{"cpu":"1","memory":"384Mi"},"requests":{"cpu":"100m","memory":"96Mi"}}
          startupProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 1
            failureThreshold: 1
          volumeMounts:
            - {name: config, mountPath: /etc/zt-proxy, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: zt-proxy-config}
        - name: secrets
          secret:
            secretName: zt-secrets
            defaultMode: 0440
            items:
              - {key: proxy-token, path: proxy-token}
              - {key: policy-read-token, path: policy-read-token}
              - {key: redis-password, path: redis-password}

